<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TickList · 品牌设计</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1a1d26;font-family:system-ui,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:1120px;margin:auto;padding:44px 48px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:2px;color:#657088}.byline{font-size:12px;color:#657088}
  .hero{display:flex;justify-content:space-between;align-items:center;gap:32px;padding:42px 48px;background:#fff;border:1px solid #e8eaf0;border-radius:24px}
  .hero-logo{width:auto;max-width:100%;height:84px;object-fit:contain;object-position:left;display:block}.hero p{margin:22px 0 0;color:#657088;font-size:18px}.hero-icon{width:136px;height:136px;flex-shrink:0}.hero-icon img{width:100%;height:100%}.hero>div:first-child{min-width:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{padding:26px 30px;background:#fff;border:1px solid #e8eaf0;border-radius:18px;min-width:0}.dark{background:#1f2127;border-color:#1f2127;color:#f2f4ff}
  .label{font-size:12px;letter-spacing:1px;color:#657088;margin:0 0 22px}.dark .label{color:#a3abbd}.lockup{width:auto;max-width:100%;height:52px;object-fit:contain;object-position:left;display:block}.mono{display:flex;align-items:center;gap:16px}.mono img{width:52px;height:52px}.mono .reverse{background:#1f2127;padding:12px;border-radius:12px;display:flex}
  .font-status{font-size:13px;color:#657088;margin:24px 0 18px}
  .swatches{display:flex;gap:18px;flex-wrap:wrap}.swatch i{display:block;width:40px;height:40px;border-radius:12px;background:var(--color)}.swatch span{display:block;font-size:12px;margin-top:8px;color:#657088}
  .sizes{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.size{display:flex;flex-direction:column;align-items:center;gap:10px}.size span{font-size:12px;color:#657088}.size img{display:block}.motion-row{display:flex;align-items:center;gap:20px}.motion-logo{width:64px;height:64px;flex-shrink:0}.draw-tick{stroke-dasharray:44;stroke-dashoffset:0}.motion-logo.play .draw-tick{animation:draw .5s cubic-bezier(.2,.7,.2,1) both}@keyframes draw{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
  button,a.action{font:inherit;font-size:13px;background:#eef1ff;color:#3d5ae0;border:1px solid #dfe5ff;border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,a.action:hover{background:#dfe5ff}button:focus-visible,a:focus-visible{outline:3px solid #4f6ef7;outline-offset:4px}
  footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:12px;color:#657088}.downloads{display:flex;gap:12px;flex-wrap:wrap}.downloads a{color:#4f6ef7}
  @media(max-width:680px){main{padding:24px 20px}.hero{padding:28px 24px}.hero-icon{display:none}.grid{grid-template-columns:1fr}.hero p{font-size:16px}.hero-logo{height:64px}.panel{padding:24px}header{flex-wrap:wrap}}
  @media(prefers-reduced-motion:reduce){.motion-logo.play .draw-tick{animation:none}}
</style>
</head>
<body><main>
  <header><span class="eyebrow">TICKLIST / BRAND IDENTITY</span><span class="byline">Developed by Soren</span></header>
  <section class="hero" aria-label="TickList 主品牌">
    <div><img class="hero-logo" src="../assets/brand/logo-light.svg" alt="TickList，Segoe UI Bold"><p>把今天，一件件做好。</p></div>
    <div class="hero-icon"><img src="../assets/brand/icon.svg" alt="白色勾号，蓝紫色圆角方块"></div>
  </section>
  <section aria-label="正式字标说明"><p class="font-status">正式字标：Segoe UI Bold · 固定路径图形，保留既有品牌比例。</p></section>
  <div class="grid">
    <section class="panel"><p class="label">浅色背景 / PRIMARY</p><img class="lockup" src="../assets/brand/logo-light.svg" alt="浅色背景字体预览"></section>
    <section class="panel dark"><p class="label">深色背景 / REVERSE</p><img class="lockup" src="../assets/brand/logo-dark.svg" alt="深色背景字体预览"></section>
    <section class="panel"><p class="label">单色与独立符号 / MONO</p><div class="mono"><img src="../assets/brand/icon-mono-dark.svg" alt="深色单色图标"><span class="reverse"><img src="../assets/brand/icon-mono-light.svg" alt="浅色单色图标"></span><img src="../assets/brand/tick-blue.svg" alt="独立蓝色勾号"></div></section>
    <section class="panel"><p class="label">品牌色 / PALETTE</p><div class="swatches"><div class="swatch" style="--color:#4f6ef7"><i></i><span>#4F6EF7</span></div><div class="swatch" style="--color:#8473f5"><i></i><span>#8473F5</span></div><div class="swatch" style="--color:#1a1d26"><i></i><span>#1A1D26</span></div><div class="swatch" style="--color:#22a06b"><i></i><span>完成反馈</span></div></div></section>
    <section class="panel"><p class="label">实际尺寸 / SMALL SIZES</p><div class="sizes"><div class="size"><img src="../assets/brand/favicon.svg" width="16" height="16" alt="16 像素图标"><span>16 px</span></div><div class="size"><img src="../assets/brand/icon-solid.svg" width="24" height="24" alt="24 像素图标"><span>24 px</span></div><div class="size"><img src="../assets/brand/icon.svg" width="32" height="32" alt="32 像素图标"><span>32 px</span></div><div class="size"><img src="../assets/brand/icon.svg" width="48" height="48" alt="48 像素图标"><span>48 px</span></div></div></section>
    <section class="panel"><p class="label">勾号绘制 / MOTION</p><div class="motion-row"><svg class="motion-logo" id="motionLogo" viewBox="0 0 64 64" role="img" aria-label="TickList 勾号绘制动画"><rect width="64" height="64" rx="18" fill="#4f6ef7"/><path class="draw-tick" d="m18 33 10 10 19-21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><button type="button" id="playMotion">播放绘制动画</button></div></section>
  </div>
  <footer><span>TickList · 打开即用的本地待办清单</span><div class="downloads"><a href="../assets/brand/icon.svg" download>图标 SVG</a><a href="../assets/brand/logo-light.svg" download>正式字标 SVG</a><a href="../assets/brand/icon-512.png" download>图标 PNG</a><a href="../index.html" class="action">打开清单</a></div></footer>
</main>
<script>
  const motionLogo = document.getElementById('motionLogo');
  document.getElementById('playMotion').addEventListener('click', () => {
    motionLogo.classList.remove('play');
    void motionLogo.getBoundingClientRect();
    motionLogo.classList.add('play');
  });
</script>
</body></html>
